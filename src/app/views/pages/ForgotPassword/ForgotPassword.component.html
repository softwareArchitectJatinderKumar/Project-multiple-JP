<app-topslider></app-topslider>
<app-journalmenubar></app-journalmenubar>
<app-journal-inner-menu></app-journal-inner-menu>
<section>
  <div class="container-fluid  p-0 mt-3">
    <div class="row">
      <div class="col-md-12 grid-margin stretch-card">
        <div class="card-body main-heading">
          <h1 class="mb-4 text-center">Lpu e-Journals </h1>
          <br />
          <h1 class="mb-2 text-center main-heading "> Account Recovery Page </h1>
        </div>
      </div>
    </div>
  </div>
  <div class="wizard-container vh-100 ">
    <!-- Fullscreen Loader -->
    <div *ngIf="isLoading" class="fullscreen-loader">
      <div class="loader-content">
        <span class="text-danger fs-3">Processing...</span><br />
        <div class="spinner-grow text-warn" style="width: 16rem; height: 16rem;" role="status"></div>
      </div>
    </div>

    <!-- Main Content (hidden when loading) -->
    <div class="container-fluid" *ngIf="!isLoading">
      <div class="row">
        <!-- Step 1: Email Form -->
        <div *ngIf="currentStep === 1" class="container">
          <h3 class="main-heading">Your Registered Email</h3>
          <form [formGroup]="emailFormGroup" novalidate>
            <input type="email" id="email" formControlName="email" required autocomplete="off" />
            <div *ngIf="emailFormGroup.get('email')?.touched && emailFormGroup.get('email')?.invalid">
              <small *ngIf="emailFormGroup.get('email')?.hasError('required')">Email is required.</small>
              <small *ngIf="emailFormGroup.get('email')?.hasError('email')">Enter a valid email.</small>
            </div>
            <button class="btn btn-outline-danger mt-4" type="button" (click)="checkEmail()"
              [disabled]="emailFormGroup.invalid">
              Next
            </button>

            <p *ngIf="errorMessage" class="error text-danger fs-5 p-4 fw-bolder">{{ errorMessage }}</p>
          </form>
        </div>

        <!-- Step 2: ID Proof Verification -->
        <div *ngIf="currentStep === 2" class="container">
          <h2 class="fs-2 mb-4">Reset Password</h2>
          <form [formGroup]="consentFormGroup">
            <div class="inline-checkbox-label mb-3">
              <input type="checkbox" id="consent" formControlName="consent" class="form-check-input" />
              <label for="consent" class="form-check-label fw-bold text-danger mb-0">
                I give my consent to reset my password and receive it at my registered email.
              </label>
            </div>

            <div *ngIf="consentFormGroup.get('consent')?.touched && consentFormGroup.get('consent')?.invalid"
              class="text-danger mb-3">
              <small>Consent is required.</small>
            </div>

            <div class="d-flex justify-content-between mt-4 mb-4">
              <button class="btn btn-outline-danger" type="button" (click)="previousStep()">Back</button>
              <button class="btn btn-outline-danger" type="button" (click)="resetPassword()"
                [disabled]="consentFormGroup.invalid">
                Submit
              </button>
            </div>

            <p *ngIf="errorMessage" class="error text-danger fs-5 p-4 fw-bolder">{{ errorMessage }}</p>
          </form>
        </div>
      </div>
    </div>
 
    <div class="container border-0">
      <div class="d-flex justify-content-between">
        <button type="submit" class="btn btn-outline-danger" (click)="VisitUrl(BookId, name, 'ExternalLogin')">Login
        </button>
        <button type="button" (click)="VisitUrl(BookId, name, 'signup')" class="btn btn-outline-danger ">
          sign Up
        </button>
      </div>
    </div>
  </div>
</section>
