<section class="reset-section py-5 bg-light">
  <div class="container">
    <div class="text-center mb-4 text-danger">
      <h2 class="title test-danger mb-3 p-2">{{ securityMessage }} </h2>
    </div>
    <div class="card shadow-lg border-0 p-4 mx-auto" style="max-width: 60rem;">
      <h3 class="text-center text-primary mb-4">Secure Password Update</h3>
      <p class="text-center text-muted mb-4">{{ securityMessage }}</p>

      <div *ngIf="errorMessage" class="alert alert-danger text-center">{{ errorMessage }}</div>
      <div *ngIf="successMessage" class="alert alert-success text-center">{{ successMessage }}</div>

      <div class="progress mb-4" style="height: 6px;">
        <div class="progress-bar bg-primary" [style.width]="isVerified ? '100%' : '50%'"></div>
      </div>

      <form [formGroup]="resetForm" (ngSubmit)="onSubmit()" novalidate>
        <!-- Step 1 -->
        <div *ngIf="!isVerified">
          <h5 class="text-primary mb-3">Step 1: Verify Your Mobile</h5>

          <div class="mb-3">
            <label class="form-label">Registered Email ID</label>
            <input type="text" formControlName="emailId" readonly class="form-control-plaintext border-bottom">
          </div>

          <div class="mb-3">
            <label class="form-label">Enter Registered Mobile Number</label>
            <div class="input-group">
              <span class="input-group-text"><i class="fa fa-phone"></i></span>
              <input type="text" formControlName="mobileNumber" class="form-control"
                placeholder="Enter your 10-digit mobile number"
                [ngClass]="{'is-invalid': mobileNumber?.invalid && mobileNumber?.touched || mobileNumber?.errors?.['mismatch']}">
              <div *ngIf="mobileNumber?.errors?.['mismatch']" class="invalid-feedback">
                Mobile number does not match our records.
              </div>
              <div *ngIf="mobileNumber?.errors?.['pattern']" class="invalid-feedback">
                Enter a valid 10-digit number.
              </div>
            </div>
          </div>

          <button type="button" class="btn btn-warning w-100"
            [disabled]="isVerifying || resetForm.get('mobileNumber')?.invalid" (click)="verifyIdentity()">
            {{ isVerifying ? 'Verifying...' : 'Verify Mobile Number' }}
          </button>
        </div>

        <!-- Step 2 -->
        <div *ngIf="isVerified">
          <h5 class="text-success mb-3">Step 2: Update Your Password</h5>

          <div class="mb-3">
            <label class="form-label">New Password</label>
            <div class="input-group">
              <span class="input-group-text"><i class="fa fa-lock"></i></span>
              <input type="password" formControlName="newPassword" class="form-control" placeholder="Enter new password"
                [ngClass]="{'is-invalid': newPassword?.invalid && newPassword?.touched}">
            </div>
            <div *ngIf="newPassword?.invalid && newPassword?.touched" class="invalid-feedback">
              Minimum 8 characters required.
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label">Confirm New Password</label>
            <div class="input-group">
              <span class="input-group-text"><i class="fa fa-lock"></i></span>
              <input type="password" formControlName="confirmNewPassword" class="form-control"
                placeholder="Re-enter new password"
                [ngClass]="{'is-invalid': confirmNewPassword?.invalid && confirmNewPassword?.touched || resetForm.errors?.['mismatch']}">
            </div>
            <div *ngIf="resetForm.errors?.['mismatch']" class="invalid-feedback">
              Passwords do not match.
            </div>
          </div>

          <button type="submit" class="btn btn-primary w-100" [disabled]="resetForm.invalid || isSubmitting">
            {{ isSubmitting ? 'Updating...' : 'Update Password' }}
          </button>
        </div>
      </form>
    </div>
  </div>
</section>
