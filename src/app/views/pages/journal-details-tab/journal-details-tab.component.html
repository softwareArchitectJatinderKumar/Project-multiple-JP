<section>
  <div class="container-fluid journal-details-tabs">
    <div class="row mb-5">
      <ul class="nav-tabs border-0 d-none d-lg-flex flex-column col-lg-3" id="journal-details-tab" role="tablist">
        <li>
          <a class="active" id="Introduction-tab" data-bs-toggle="tab" data-bs-target="#Introduction-tab-pane"
            role="tab" aria-controls="Introduction-tab-pane" aria-selected="true">Introduction</a>
        </li>
        <li>
          <a class="" id="Scope-of-Journal-tab" data-bs-toggle="tab" data-bs-target="#Scope-of-Journal-tab-pane"
            role="tab" aria-controls="Scope-of-Journal-tab-pane" aria-selected="false">Scope of Journal</a>
        </li>
        <li>
          <a class="" id="Thrust-Areas-tab" data-bs-toggle="tab" data-bs-target="#Thrust-Areas-tab-pane" role="tab"
            aria-controls="Thrust-Areas-tab-pane" aria-selected="false">Thrust Areas</a>
        </li>
        <li>
          <a class="" id="Article-Types-tab" data-bs-toggle="tab" data-bs-target="#Article-Types-tab-pane" role="tab"
            aria-controls="Article-Types-tab-pane" aria-selected="false">Article Types</a>
        </li>
      </ul>

      <div class="tab-content accordion  col-lg-9 col-md-12" id="journal-details-tab-Content">
        <ng-container *ngFor="let item of itemsArray">
          <!-- Introduction -->
          <div class="tab-pane fade show active accordion-item mb-4 " id="Introduction-tab-pane" role="tabpanel"
            aria-labelledby="Introduction-tab" tabindex="0">
            <div id="collapseOne" class="accordion-collapse collapse show d-lg-block" aria-labelledby="headingOne"
              data-bs-parent="#journal-details-tab-Content">
              <div class="accordion-body accordionColor" id="journal-scroll" style="max-height: 340px; overflow-y: auto; padding-right: 10px;">
                <p class="accordionColor" [innerHTML]="item.introduction"></p>
              </div>
            </div>
          </div>

          <!-- Scope of Journal -->
          <div class="tab-pane fade accordion-item mb-5" id="Scope-of-Journal-tab-pane" role="tabpanel"
            aria-labelledby="Scope-of-Journal-tab" tabindex="0">
            <div id="collapseTwo" class="accordion-collapse collapse d-lg-block" aria-labelledby="headingTwo"
              data-bs-parent="#journal-details-tab-Content">
              <div class="accordion-body accordionColor" id="scope-scroll" style="max-height: 340px; overflow-y: auto; padding-right: 10px; "> 
                <p [innerHTML]="item.scopeofJournal" style="text-align: justify;"></p>
              </div>
            </div>
          </div>

          <!-- Thrust Areas -->
          <div class="tab-pane fade accordion-item mb-5" id="Thrust-Areas-tab-pane" role="tabpanel"
            aria-labelledby="Thrust-Areas-tab" tabindex="0">
            <div id="collapseThree" class="accordion-collapse collapse d-lg-block" aria-labelledby="headingThree"
              data-bs-parent="#journal-details-tab-Content">
              <div class="accordion-body accordionColor" id="thrust-scroll" style="max-height: 340px; overflow-y: auto; padding-right: 10px;">
                <p class="container" [innerHTML]="item.thrustArea" style="text-align: justify;"></p> 
              </div>
            </div>
          </div>

          <!-- Article Types -->
          <div class="tab-pane fade accordion-item mb-5" id="Article-Types-tab-pane" role="tabpanel"
            aria-labelledby="Article-Types-tab" tabindex="0">
            <div id="collapseFour" class="accordion-collapse collapse d-lg-block" aria-labelledby="headingFour"
              data-bs-parent="#journal-details-tab-Content">
              <div class="accordion-body accordionColor" id="article-scroll" 
              style="max-height: 340px; overflow-y: auto; padding-right: 10px;">
                <p [innerHTML]="item.articleType" style="text-align: justify;"></p> <!-- Display Article Types -->
              </div>
            </div>
          </div>
        </ng-container>
      </div>
    </div>
  </div>
</section>
<script>
  if ($(window).width() >= 992) {
    $('#journal-scroll, #scope-scroll, #thrust-scroll, #article-scroll, #editorial-scroll').slimscroll({
      height: '400px',
      alwaysVisible: true,
      distance: '5px',
      railVisible: true,
      size: '2px',
      color: '#E77000',
      opacity: 1
    });
  }
</script>
