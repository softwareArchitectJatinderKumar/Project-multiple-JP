<section>
    <div class="container popular-genre-section">
        <div class="popular-genre">
            <div class="title">
                <h3>Popular by Genre</h3>
            </div>
            <ul class="nav nav-tabs" id="myTab" role="tablist">
                <li>
                    <a class="active" id="journals-tab" data-bs-toggle="tab" data-bs-target="#journals" role="tab"
                        aria-controls="journals" aria-selected="true">Journals<span></span></a>
                </li>
            </ul>
        </div>
        <div class="tab-content" id="myTabContent">
            <div class="tab-pane fade show active" id="journals" role="tabpanel" aria-labelledby="journals-tab">
                <div class="row">
                    <div class="col-md-4" *ngFor="let dataRow of getRecordsForCurrentPage(); let i = index">
                        <div class="popular-genre-content">
                            <div class="popular-genre-img"> 
                                <img 
                                    [src]="this.serverUrl+dataRow.imageUrl" 
                                    height="220" 
                                    width="200"
                                />                                
                                <h4 class="d-md-none d-lg-block">{{ dataRow.journalTitle }}</h4>
                            </div>
                            <p class="popular-genre-desc">
                                {{ dataRow.journalTitle }} {{ dataRow.genres }}
                            </p>
                            <p class="popular-genre-author"> {{ dataRow.editorName }} </p>
                        </div>
                    </div>
                </div>
        
                <div class="d-flex justify-content-end align-item-center mt-3">
                   
                 
                    <!-- <label for="pageSize" class="me-2">Items per page:</label>
                    <select id="pageSize" class="form-select d-inline w-auto vh-auto" style="height: fit-content;" [(ngModel)]="recordsPerPage" (change)="getRecordsForCurrentPage()">
                        <option *ngFor="let size of pageSizeOptions" [value]="size">{{ size }}</option>
                    </select> -->
                    <div class="ms-3">
                        <nav>
                            <ul class="pagination text-dark">
                                <li 
                                    class="page-item" 
                                    [class.disabled]="currentPage === 1" 
                                    (click)="currentPage !== 1 && changePage(currentPage - 1)">
                                    <span class="page-link "><</span>
                                </li>
                                <li 
                                    class="page-item" 
                                    *ngFor="let page of totalPagesArray  " 
                                    [class.active]="page == currentPage" 
                                    (click)="changePage(page)">
                                    <span class="page-link arrowColor">{{ page }}</span>
                                </li>
                                <li 
                                    class="page-item " 
                                    [class.disabled]="currentPage == totalPagess" 
                                    (click)="currentPage !== totalPagess && changePage(currentPage + 1)"
                                     >
                                    <span class="page-link text-dark">></span>
                                </li>
                            </ul>
                        </nav>
                    </div>
                </div>
            </div>
        </div>
            <div class="tab-pane fade" id="books" role="tabpanel" aria-labelledby="books-tab">2</div>
        </div>
</section>
