


 <app-topslider></app-topslider>
<app-journalmenubar></app-journalmenubar>
<app-journal-inner-menu></app-journal-inner-menu>

<div class="login-page-container">
  <!-- Header Section -->
  <div class="row mt-4">
    <div class="main-heading text-center">
      <h1>{{this.JournalTitle}}</h1>
    </div>
  </div>

  <!-- Loading Overlay -->
  <div *ngIf="isLoading" class="fullscreen-loader">
    <div class="loader-content">
      <span class="text-danger fs-3">Processing...</span><br />
      <div class="spinner-grow text-danger" style="width: 16rem; height: 16rem;" role="status"></div>
    </div>
  </div>

  <!-- Main Login Card -->
  <div *ngIf="!loadingIndicator; else ErrorConnection" class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-lg-12">
        
        <div class="login-card-wrapper" *ngIf="!isLoading">
          <div class="row g-0">
            
            <!-- Left Side - Image (Hidden on mobile) -->
            <div class="col-lg-6 d-none d-lg-block login-image-section">
              <div class="login-image-wrapper" 
                   [ngStyle]="{ 'background-image': 'url(https://www.lpu.in/journals/assets/images/login-left.png)'}">
                <div class="image-overlay"></div>
              </div>
            </div>

            <!-- Right Side - Login Form -->
            <div class="col-12 col-lg-6 login-form-section">
              <div class="login-form-container">
                <div class="text-center mb-4">
                  <h2 class="login-title">Welcome Back</h2>
                  <p class="login-subtitle">Sign in to access LPU e-Journals</p>
                </div>

                <form class="forms-sample" [formGroup]="formdata" (ngSubmit)="OnSubmit()">
                  <!-- Email Field -->
                  <div class="form-group mb-3">
                    <label for="exampleInputEmail1" class="form-label">Email Address</label>
                    <div class="input-group">
                      <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                      <input type="email" 
                             formControlName="Email" 
                             placeholder="Enter your email" 
                             class="form-control" 
                             id="exampleInputEmail1"
                             [class.is-invalid]="submitted && email?.errors">
                    </div>
                    <div *ngIf="submitted && email?.errors" class="invalid-feedback d-block">
                      <small *ngIf="email?.errors?.['required']">Email is required.</small>
                      <small *ngIf="email?.errors?.['email']">Enter a valid email address.</small>
                    </div>
                  </div>

                  <!-- Password Field -->
                  <div class="form-group mb-3">
                    <label for="exampleInputPassword1" class="form-label">Password</label>
                    <div class="input-group">
                      <span class="input-group-text"><i class="bi bi-lock"></i></span>
                      <input [type]="showPassword ? 'text' : 'password'" 
                             class="form-control" 
                             placeholder="Enter your password" 
                             formControlName="Password" 
                             id="exampleInputPassword1"
                             [class.is-invalid]="submitted && password?.errors">
                      <button type="button" class="btn btn-outline-secondary" (click)="togglePasswordVisibility()">
                        <i class="bi" [ngClass]="showPassword ? 'bi-eye-slash' : 'bi-eye'"></i>
                      </button>
                    </div>
                    <div *ngIf="submitted && password?.errors" class="invalid-feedback d-block">
                      <small *ngIf="password?.errors?.['required']">Password is required.</small>
                      <small *ngIf="password?.errors?.['minlength']">Password must be at least 6 characters.</small>
                    </div>
                  </div>

                  <!-- Error Message -->
                  <div class="alert alert-danger py-2" *ngIf="errorMessage" role="alert">
                    <i class="bi bi-exclamation-circle me-2"></i>{{errorMessage}}
                  </div>

                  <!-- Action Buttons -->
                  <div class="d-grid gap-2 mt-4">
                    <button type="submit" class="btn btn-primary btn-login">
                      <i class="bi bi-box-arrow-in-right me-2"></i>Login
                    </button>
                    <button type="button" (click)="VisitUrl(BookId, name, 'signup')" class="btn btn-outline-primary btn-register">
                      <i class="bi bi-person-plus me-2"></i>Register Now
                    </button>
                    <button type="button" (click)="VisitUrl(BookId, name, 'ForgotPassword')" class="btn btn-link btn-forgot">
                      Forgot Password?
                    </button>
                  </div>
                </form>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Error Connection Template -->
<ng-template #ErrorConnection>
  <div id="ServerError" class="error-container">
    <div class="text-center">
      <span class="text-danger fs-3">Loading</span><br />
      <div class="spinner-grow text-danger" style="width: 14rem; height: 14rem;" role="status"></div>
    </div>
  </div>
</ng-template>
